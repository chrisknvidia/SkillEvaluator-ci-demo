name: Real consumer test image
on:
  push:
    branches: [feat/christopherk/real-consumer-image-20261102]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: NVIDIA/SkillEvaluator
          ref: 36339548c6d718b7a8f79468f68a6a5056b24c65
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Authenticate personal test package
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u chrisknvidia --password-stdin
      - name: Build and push the test image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ci/Dockerfile.tier1
          platforms: linux/amd64
          tags: ghcr.io/chrisknvidia/skillevaluator-ci-demo:real-consumer-36339548
          labels: org.opencontainers.image.revision=36339548c6d718b7a8f79468f68a6a5056b24c65
          push: true
          provenance: false
          cache-from: type=gha,scope=real-consumer-image
          cache-to: type=gha,scope=real-consumer-image,mode=max
      - name: Record image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: ghcr.io/chrisknvidia/skillevaluator-ci-demo@%s\nSource: 36339548c6d718b7a8f79468f68a6a5056b24c65\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
