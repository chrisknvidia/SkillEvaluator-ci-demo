name: Publish demo Tier 1 image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'chrisknvidia/SkillEvaluator-ci-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build and verify the demo image
        env:
          IMAGE: ghcr.io/chrisknvidia/skillevaluator-ci-demo
        run: |
          docker build -f ci/Dockerfile.tier1 -t "$IMAGE:gitlab-e2e-$GITHUB_SHA" .
          python3 ci/smoke_image.py --image "$IMAGE:gitlab-e2e-$GITHUB_SHA" --output "$RUNNER_TEMP/demo-smoke"
      - name: Publish the demo-only image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/chrisknvidia/skillevaluator-ci-demo
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:gitlab-e2e-$GITHUB_SHA"
          docker image inspect "$IMAGE:gitlab-e2e-$GITHUB_SHA" --format '{{index .RepoDigests 0}}'
          docker logout ghcr.io
